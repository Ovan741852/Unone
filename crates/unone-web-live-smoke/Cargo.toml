[package]
name = "unone-web-live-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unone-web-live-smoke"
path = "src/main.rs"

[features]
default = ["dev-tools"]
dev-tools = ["unone-engine/dev-tools"]
preview-tools = ["unone-engine/preview-tools"]
phase-profile = ["preview-tools", "unone-engine/phase-profile"]
sampling-profile = ["preview-tools", "unone-engine/sampling-profile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unone-engine = { path = "../unone-engine", default-features = false, features = ["all-systems"] }
