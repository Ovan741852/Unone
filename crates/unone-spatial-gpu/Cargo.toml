[package]
name = "unone-spatial-gpu"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
unone-engine = { path = "../unone-engine", default-features = false }
wgpu = "30"
pollster = "0.4"
bytemuck = "1"

[dev-dependencies]
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }

[workspace]

# Luau with read-only buffers (api.bytes.freeze); see vendor/luau0-src/UNONE.md.
[patch.crates-io]
luau0-src = { path = "../../vendor/luau0-src" }
mlua = { path = "../../vendor/mlua" }
