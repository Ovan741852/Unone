[package]
name = "unone-player"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
dev-tools = []
preview-tools = ["unone-engine/preview-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unone-engine = { path = "../unone-engine", default-features = false }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
