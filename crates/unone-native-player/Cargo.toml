[package]
name = "unone-native-player"
version = "0.2.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[[bin]]
name = "unone-native-player"
path = "src/main.rs"
[features]
native-codegen = ["unone-engine/native-codegen"]
[dependencies]
unone-engine = { path = "../unone-engine", default-features = false, features = ["all-systems"] }
unone-spatial-gpu = { path = "../unone-spatial-gpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23"
resvg = "0.48"
roxmltree = "0.21"
unicode-segmentation = "1.13"
unicode-script = "0.5"
rodio = "0.22.2"
[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30.12"
[target.'cfg(target_os = "android")'.dependencies]
winit = {version = "0.30.12", features = ["android-native-activity"]}
[workspace]
[profile.release]
opt-level = 3
strip = "debuginfo"

# Luau with read-only buffers (api.bytes.freeze); see vendor/luau0-src/UNONE.md.
[patch.crates-io]
luau0-src = { path = "../../vendor/luau0-src" }
mlua = { path = "../../vendor/mlua" }
