[package]
name = "unone-native-player"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[[bin]]
name = "unone-native-player"
path = "src/main.rs"
[features]
native-codegen = ["unone-engine/native-codegen"]
[dependencies]
unone-engine = { path = "../unone-engine", default-features = false, features = ["all-systems"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30.12"
[target.'cfg(target_os = "android")'.dependencies]
winit = {version = "0.30.12", features = ["android-native-activity"]}
[workspace]
[profile.release]
opt-level = 3
strip = "debuginfo"
