[package]
name = "unone-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
serde = "1"
serde_json = "1"
unone-engine = { path = "../unone-engine" }
wgpu = "30"
winit = "0.30.12"
