[package]
name = "unone-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native-codegen = ["mlua/luau-jit"]
default = ["dev-tools", "all-systems"]
dev-tools = ["dep:schemars", "preview-tools"]
preview-tools = []
all-systems = ["physics2d", "physics3d", "camera", "random", "ui", "save", "audio", "spine", "particle", "effekseer", "jobs"]
jobs = []
physics2d = []
physics3d = ["dep:rapier3d"]
# One build capability for the Unity-like Camera. The split names remain
# feature-level compatibility switches for lean hosts that intentionally ship
# only one projection backing.
camera = ["camera2d", "camera3d"]
camera2d = []
camera3d = []
random = []
ui = []
save = []
audio = []
spine = []
particle = []
effekseer = []

[dependencies]
anyhow = "1"
base64 = "0.23"
mlua = { version = "0.11", features = ["luau", "vendored"] }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
# Canonical snapshots, saves and host presentation envelopes must preserve every
# finite binary64 value through a JSON parse/serialize cycle on every host.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
rapier3d = { optional = true, version = "=0.26.1", default-features = false, features = ["dim3", "f32", "enhanced-determinism"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[example]]
name = "profile_native"
required-features = ["dev-tools"]
