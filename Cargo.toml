[workspace]
members = [
    "crates/unone-engine",
    "crates/unone-cli",
    "crates/unone-web-smoke",
    "crates/unone-web-live-smoke",
    "crates/unone-mobile-ffi",
    "crates/unone-mobile-android-smoke",
]
resolver = "2"
exclude = ["crates/unone-player", "crates/unone-native-player"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.0"

# Luau with read-only buffers (api.bytes.freeze); see vendor/luau0-src/UNONE.md.
[patch.crates-io]
luau0-src = { path = "vendor/luau0-src" }
