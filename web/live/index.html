<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../smoke/favicon.svg" type="image/svg+xml" />
    <title>Unone live Web host</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      body { margin: 0; min-height: 100vh; background: #0b1020; color: #e5e7eb; }
      main { width: min(1120px, calc(100vw - 32px)); margin: 24px auto; }
      h1 { margin: 0 0 6px; font-size: 1.25rem; }
      .note { color: #9ca3af; margin-top: 0; }
      #status { color: #93c5fd; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
      #game-shell { position: relative; min-width: 0; }
      canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid #334155; border-radius: 10px; background: #111827; touch-action: none; }
      #ui-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .unone-ui-node { position: absolute; box-sizing: border-box; overflow: hidden; color: #f8fafc; text-align: left; }
      .unone-ui-text { padding: 2px 4px; }
      .unone-ui-button { padding: 2px 6px; border: 1px solid #93c5fd; border-radius: 5px; background: rgba(30, 64, 175, .8); color: #f8fafc; font: inherit; }
      .unone-ui-image { display: block; object-fit: contain; pointer-events: none; }
      aside { padding: 14px; border: 1px solid #334155; border-radius: 10px; background: #111827; }
      h2 { margin: 0 0 8px; font-size: 1rem; }
      button { margin-bottom: 12px; padding: 7px 10px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e5e7eb; font: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      pre { min-height: 12rem; max-height: 26rem; margin: 0; overflow: auto; white-space: pre-wrap; color: #a7f3d0; }
      @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Unone live Web host</h1>
      <p id="status" data-testid="status">waiting for Emscripten runtime…</p>
      <p class="note">The browser owns fetch, IndexedDB and WebGPU; Rust owns bundle integrity, live frame semantics and Luau simulation.</p>
      <div class="layout">
        <div id="game-shell">
          <canvas id="game" data-testid="game-canvas" aria-label="Unone live engine preview"></canvas>
          <div id="ui-layer" data-testid="ui-layer" aria-label="Engine declarative UI"></div>
        </div>
        <aside>
          <h2>Semantic live state</h2>
          <button id="reload-script" data-testid="reload-script" disabled>Reload Luau script</button>
          <button id="bundle-update" data-testid="bundle-update" disabled>Apply bundle update</button>
          <pre id="output" data-testid="output"></pre>
        </aside>
      </div>
    </main>
    <script type="module" src="./main.js?v=5"></script>
    <script>
      var Module = {
        noInitialRun: true,
        onRuntimeInitialized: function () {
          window.unoneRuntimeReady = true;
          window.dispatchEvent(new Event("unone-runtime-ready"));
        }
      };
    </script>
    <script src="../../target/wasm32-unknown-emscripten/debug/deps/unone_web_live_smoke.js"></script>
  </body>
</html>
