<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Unone browser runtime smoke</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; }
      main { width: min(720px, calc(100vw - 48px)); padding: 28px; border: 1px solid #374151; border-radius: 12px; background: #1f2937; box-shadow: 0 18px 60px #0006; }
      h1 { margin-top: 0; font-size: 1.25rem; }
      #status { color: #93c5fd; }
      pre { min-height: 5rem; padding: 16px; overflow: auto; white-space: pre-wrap; border-radius: 8px; background: #030712; color: #a7f3d0; }
      .note { color: #9ca3af; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Unone browser runtime smoke</h1>
      <p id="status" data-testid="status">loading Emscripten module…</p>
      <pre id="output" data-testid="output"></pre>
      <p class="note">This page proves browser loading and execution of the memory-backed Luau runtime. It is not yet the WebGPU game host.</p>
    </main>
    <script>
      var Module = {
        print: function (line) {
          var output = document.getElementById("output");
          output.textContent += String(line) + "\n";
          if (String(line).indexOf("unone_web_smoke completed:") === 0) {
            document.getElementById("status").textContent = "passed: 60 deterministic frames executed";
          }
        },
        printErr: function (line) {
          var output = document.getElementById("output");
          output.textContent += "ERR: " + String(line) + "\n";
          document.getElementById("status").textContent = "failed: see output";
        },
        onAbort: function (reason) {
          document.getElementById("status").textContent = "aborted: " + String(reason);
        }
      };
    </script>
    <script src="../../target/wasm32-unknown-emscripten/debug/deps/unone_web_smoke.js"></script>
  </body>
</html>
