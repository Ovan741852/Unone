<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15191d" />
    <title>Frame Atelier · Unone</title>
    <link rel="stylesheet" href="./style.css?v=18" />
  </head>
  <body>
    <div class="app-shell" data-unone-app="frame-atelier">
      <header class="topbar">
        <a class="brand" href="../../" aria-label="Unone">
          <span class="brand-mark">U</span>
          <span class="brand-copy"><strong>FRAME ATELIER</strong><small>介面編輯器</small></span>
        </a>
        <div class="project-name-wrap">
          <label class="sr-only" for="project-name">專案名稱</label>
          <input id="project-name" class="project-name" value="Yes Sir · 英雄裝備" maxlength="48" />
          <span class="save-state"><i></i><span id="save-state">已儲存</span></span>
        </div>
        <div class="topbar-actions">
          <button class="history-button" id="undo" type="button" title="復原 Ctrl+Z" aria-label="復原">↶</button>
          <button class="history-button" id="redo" type="button" title="重做 Ctrl+Y" aria-label="重做">↷</button>
          <button class="top-button" id="new-project" type="button">空白專案</button>
          <button class="top-button" id="reset-project" type="button" title="還原預設範例">還原範例</button>
          <button class="top-button" id="import-project" type="button">匯入專案</button>
          <button class="top-button" id="export-project" type="button">匯出專案</button>
          <input id="project-file" type="file" accept=".json,application/json" hidden />
        </div>
      </header>

      <div class="workbench">
        <aside class="left-panel">
          <section class="palette-section">
            <div class="section-heading">
              <div><span class="eyebrow">ADD</span><h1>元件</h1></div>
              <span class="section-hint">拖入畫布</span>
            </div>
            <div id="component-palette">
              <div class="palette-group">
                <span class="palette-group-label">結構與排列</span>
                <div class="component-grid">
                <button class="component-tile" type="button" draggable="true" data-add-type="container"><span class="component-icon icon-container"><i></i></span><span>Container</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="panel"><span class="component-icon icon-panel">▱</span><span>Panel</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="scrollview"><span class="component-icon icon-scroll"><i></i></span><span>ScrollView</span></button>
                </div>
              </div>
              <div class="palette-group">
                <span class="palette-group-label">視覺元件</span>
                <div class="component-grid">
                <button class="component-tile" type="button" draggable="true" data-add-type="button"><span class="component-icon icon-button">●</span><span>Button</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="label"><span class="component-icon icon-label">T</span><span>Label</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="image"><span class="component-icon icon-image">▧</span><span>Image</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="input"><span class="component-icon icon-input">▤</span><span>Input</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="checkbox"><span class="component-icon icon-check">✓</span><span>Checkbox</span></button>
                <button class="component-tile" type="button" draggable="true" data-add-type="progressbar"><span class="component-icon icon-progress"><i></i></span><span>ProgressBar</span></button>
                </div>
              </div>
              <p class="palette-note">清單／格子用排列容器＋共用 Prefab 組成</p>
            </div>
          </section>

          <section class="tree-section">
            <div class="section-heading tree-heading">
              <div><span class="eyebrow">LAYERS</span><h2>結構</h2></div>
              <button class="small-icon-button" id="add-root" type="button" title="新增元件">＋</button>
            </div>
            <div class="tree-list" id="element-tree" role="tree" aria-label="介面元件結構" tabindex="-1"></div>
            <p class="tree-tip">Container、Panel、ScrollView 都能收納子元件。</p>
          </section>

          <section class="prefab-section">
            <div class="section-heading prefab-heading">
              <div><span class="eyebrow">PROJECT LIBRARY</span><h2>共用元件</h2></div>
              <span id="prefab-count" class="count-pill">0</span>
            </div>
            <div class="prefab-list" id="prefab-list"></div>
          </section>
        </aside>

        <main class="editor-main">
          <div class="canvas-toolbar">
            <div class="tool-group" role="toolbar" aria-label="畫布工具">
              <button class="tool-button is-active" type="button" data-tool="select" title="選取並拖曳"><span>↖</span>選取</button>
              <button class="tool-button" type="button" data-tool="draw" title="在畫布空白處拖曳新增 Panel"><span>▱</span>框選 Panel</button>
              <button class="tool-button" type="button" id="toggle-grid" aria-pressed="true"><span>▦</span>格線</button>
            </div>
            <div class="canvas-toolbar-right">
              <div class="profile-switch" role="group" aria-label="畫布尺寸">
                <button class="profile-button is-active" type="button" data-profile="desktop">電腦 <span>1920 × 1080</span></button>
                <button class="profile-button" type="button" data-profile="mobile">手機 <span>390 × 844</span></button>
              </div>
              <span class="toolbar-divider"></span>
              <button class="zoom-button" id="zoom-out" type="button" aria-label="縮小畫布">−</button>
              <span class="zoom-value" id="zoom-value">適合視窗</span>
              <button class="zoom-button" id="zoom-in" type="button" aria-label="放大畫布">＋</button>
              <button class="zoom-fit" id="zoom-fit" type="button">置中</button>
            </div>
          </div>

          <section class="canvas-area" id="canvas-area" aria-label="畫布工作區">
            <div class="canvas-scroll" id="canvas-scroll">
              <div class="artboard" id="artboard" data-profile="desktop" aria-label="設計畫布">
                <div class="scene" id="scene"></div>
                <div class="drop-hint" id="drop-hint" hidden>放開以新增元件</div>
              </div>
            </div>
            <div class="canvas-footer">
              <span><i class="live-dot"></i><span id="canvas-message">拖曳移動；選取後可改尺寸</span></span>
              <span id="canvas-size">1920 × 1080</span>
              <span id="selection-size">尚未選取</span>
            </div>
          </section>

          <section class="ai-dock" aria-label="AI 新增元件">
            <div class="ai-dock-brand">
              <span class="ai-spark">✳</span>
              <span class="ai-dock-copy"><strong id="ai-dock-title">描述整個介面</strong><span class="ai-status-row"><small id="ai-status" role="status" aria-live="polite">正在檢查 Gemma 4…</small><button class="ai-retry" id="ai-retry" type="button" hidden>重試連線</button></span></span>
            </div>
            <button class="mic-button" id="voice-input" type="button" title="語音輸入" aria-label="語音輸入">◖</button>
            <label class="sr-only" for="ai-prompt">描述要新增的畫面，或修改選取的容器</label>
            <textarea id="ai-prompt" rows="1" placeholder="描述整個畫面，例如：做一個英雄裝備頁面，重點是快速比較裝備"></textarea>
            <button class="ai-submit" id="ai-submit" type="button" disabled><span>✳</span><span id="ai-submit-label">檢查連線…</span></button>
            <span class="voice-state" id="voice-state" aria-live="polite"></span>
          </section>
        </main>

        <aside class="inspector-panel">
          <div class="inspector-top">
            <div><span class="eyebrow">INSPECTOR</span><h2 id="inspector-heading">屬性</h2></div>
            <span class="selection-badge" id="selection-badge">未選取</span>
          </div>
          <div class="inspector-content" id="inspector-content"></div>
          <section class="shared-button-style">
            <div class="shared-style-heading"><div><span class="eyebrow">PROJECT STYLE</span><h3>共用按鈕樣式</h3></div><span class="sync-mark">↻</span></div>
            <div class="style-controls">
              <label class="color-control"><span>底色</span><input id="button-color" type="color" value="#2e8f7b" /></label>
              <label class="radius-control"><span>圓角</span><input id="button-radius" type="number" min="0" max="32" value="8" /><small>px</small></label>
            </div>
            <p>專案內所有按鈕共用這組基本樣式。</p>
          </section>
          <details class="change-history" id="change-history">
            <summary><span>修改紀錄</span><span class="history-count" id="change-history-count">0</span></summary>
            <div class="change-history-list" id="change-history-list" aria-live="polite"></div>
          </details>
        </aside>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./main.js?v=29"></script>
  </body>
</html>
