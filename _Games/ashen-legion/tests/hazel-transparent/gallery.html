const gallery=document.querySelector('#gallery'),search=document.querySelector('#search');let kind='all';
const picture=(record,tone)=>{const cell=document.createElement('div');cell.className='picture '+tone;const img=document.createElement('img');img.src=base+record.path;img.alt=record.name;img.loading='lazy';cell.append(img);return cell};
function draw(){gallery.replaceChildren();const term=search.value.trim().toLowerCase();const items=records.filter(r=>(kind==='all'||kind==='compare'&&r.kind==='skill'&&records.some(g=>g.id===r.pair)||r.kind===kind)&&(!term||(r.id+' '+r.name).toLowerCase().includes(term)));gallery.className=kind==='compare'?'compare':'';document.querySelector('#legend').textContent=kind==='compare'?'左側為實體裝備，右側為其技能效果。':'同一張透明 PNG，分別顯示在淺底與深底上。';document.querySelector('#count').textContent=items.length+' 項';for(const r of items){const card=document.createElement('article'),row=document.createElement('div');row.className='pair';if(kind==='compare'){const gear=records.find(g=>g.id===r.pair);for(const [item,label]of[[gear,'裝備'],[r,'技能']]){const col=document.createElement('div');col.append(picture(item,'dark'));const l=document.createElement('div');l.className='label';l.textContent=label;col.append(l);row.append(col)}}else{row.append(picture(r,'light'),picture(r,'dark'))}const name=document.createElement('div');name.className='caption';name.textContent=r.name;const id=document.createElement('small');id.textContent=r.id;card.append(row,name,id);gallery.append(card)}}
document.querySelector('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(!b)return;kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()});search.addEventListener('input',draw);draw();
