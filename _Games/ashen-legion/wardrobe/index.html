<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰燼軍團 · 紙娃娃工坊</title>
<script type="importmap">{"imports":{"three":"./vendor/package/build/three.module.js","three/addons/":"./vendor/package/examples/jsm/"}}</script>
<link rel="stylesheet" href="style.css"><body><main id="stage"></main><header><small>ASHEN LEGION / CHARACTER LAB</small><h1>灰燼軍團 <span>紙娃娃工坊</span></h1><p>旋轉拖曳 · 滾輪縮放 · 右鍵平移</p></header>
<aside><small>01 / EQUIPMENT</small><h2>士兵換裝</h2><div id="slots"></div><div class="row"><button id="naked">素體</button><button id="knight">貼圖公仔 套裝</button></div><hr><small>02 / SKELETON</small><label class="check"><input id="skeleton" type="checkbox">顯示骨架（穿透）</label><label class="check"><input id="wire" type="checkbox">線框 / 蒙皮檢查</label><label class="check"><input id="rotate" type="checkbox">自動旋轉</label><p id="stats"></p><hr><small>03 / MIXAMO</small><label class="upload">匯入 FBX 動作<input id="file" type="file" accept=".fbx"></label><div class="row"><button id="glb">匯出 GLB</button><button id="obj">素體 OBJ</button></div><p class="note">OBJ 是無裝備 T-pose，供 Mixamo Auto-Rigger 使用。FBX 匯入會依骨架名稱與綁定姿勢轉換動作。</p></aside>
<section id="transport"><div class="row"><div><small>ANIMATION PLAYER</small><h2 id="clipTitle">站立 · 程序示範</h2></div><span id="status">準備模型…</span></div><div class="row"><select id="motion"><option value="idle">站立</option><option value="walk">移動</option><option value="stretch">伸懶腰</option><option value="attack">攻擊</option><option value="death">死亡</option><option value="spawn">出生</option><option value="run">奔跑</option><option value="tpose">T-pose</option></select><button id="play">暫停</button><button id="reset">重播</button><label>速度 <select id="speed"><option>.25</option><option>.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label><span id="time">0.00 / 2.00</span></div><input id="timeline" type="range" min="0" max="2" step=".001" value="0"><p class="note">內建動作為程序示範；匯入後可播放你的 Mixamo FBX。模型單位：公尺。</p></section><div id="badge">01 / HUMAN<br><strong>貼圖公仔 • Blender / 2048 貼圖</strong></div><script type="module" src="app.mjs"></script></body></html>
