<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 100 100" role="img" aria-label="building materials" data-art-style="hazel-faceted-v1">
  <defs>
    <pattern id="hazel-planes" width="1" height="1" patternContentUnits="objectBoundingBox">
      <polygon points="0,0 .47,0 .18,.21" fill="#fff0c8" opacity=".20" />
      <polygon points=".47,0 .84,0 .62,.23 .18,.21" fill="#eed3a4" opacity=".11" />
      <polygon points="0,0 .18,.21 .05,.51 0,.39" fill="#fff0cb" opacity=".12" />
      <polygon points=".18,.21 .62,.23 .32,.44" fill="#f5e0be" opacity=".085" />
      <polygon points=".84,0 1,0 1,.37 .62,.23" fill="#2b3529" opacity=".20" />
      <polygon points=".62,.23 1,.37 .71,.56" fill="#344338" opacity=".13" />
      <polygon points=".05,.51 .18,.21 .32,.44 .17,.7" fill="#eedbbc" opacity=".07" />
      <polygon points=".32,.44 .71,.56 .34,.81" fill="#193e34" opacity=".12" />
      <polygon points="1,.37 1,.83 .71,.56" fill="#13332e" opacity=".15" />
      <polygon points="0,.39 .05,.51 .17,.7 0,.92" fill="#f4d99e" opacity=".12" />
      <polygon points=".17,.7 .34,.81 .11,1 0,1 0,.92" fill="#372d24" opacity=".19" />
      <polygon points=".34,.81 .71,.56 .65,.92 .39,1 .11,1" fill="#414a32" opacity=".11" />
      <polygon points=".71,.56 1,.83 1,1 .65,.92" fill="#152d2a" opacity=".21" />
      <polygon points=".65,.92 1,1 .39,1" fill="#f0c77e" opacity=".10" />
    </pattern>
    <linearGradient id="hazel-rim" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffe7ad" /><stop offset=".34" stop-color="#b99250" />
      <stop offset=".62" stop-color="#66503b" /><stop offset="1" stop-color="#29382c" />
    </linearGradient>
    <filter id="hazel-pigment" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".73" numOctaves="2" seed="23" result="grain" />
      <feColorMatrix in="grain" type="saturate" values="0" /><feComponentTransfer><feFuncA type="linear" slope=".045" /></feComponentTransfer>
      <feComposite operator="in" in2="SourceAlpha" result="grain" /><feBlend in="SourceGraphic" in2="grain" mode="soft-light" />
    </filter>
    <linearGradient id="hazel-stone" x1=".12" y1="0" x2=".83" y2="1"><stop offset="0" stop-color="#a6a58a" /><stop offset=".3" stop-color="#858b73" /><stop offset=".72" stop-color="#666f5b" /><stop offset="1" stop-color="#4e594b" /></linearGradient>
    <linearGradient id="hazel-wood" x1=".12" y1="0" x2=".83" y2="1"><stop offset="0" stop-color="#d4a260" /><stop offset=".3" stop-color="#b97c4a" /><stop offset=".72" stop-color="#92583d" /><stop offset="1" stop-color="#6d4132" /></linearGradient>
    <linearGradient id="hazel-brick" x1=".12" y1="0" x2=".83" y2="1"><stop offset="0" stop-color="#d47c5a" /><stop offset=".3" stop-color="#b65f47" /><stop offset=".72" stop-color="#87453b" /><stop offset="1" stop-color="#60332f" /></linearGradient>
    <linearGradient id="hazel-gold" x1=".12" y1="0" x2=".83" y2="1"><stop offset="0" stop-color="#ffe7a1" /><stop offset=".4" stop-color="#ddb260" /><stop offset="1" stop-color="#9b6835" /></linearGradient>
  </defs>
  <title>building materials</title>
  <g filter="url(#hazel-pigment)" stroke-linejoin="bevel">
    <g transform="translate(4 5) scale(.92)">
      <!-- rear stone block -->
      <path d="M18 35L45 18L72 32L45 49Z" fill="url(#hazel-stone)" stroke="#463728" stroke-width="1.35" />
      <path d="M18 35V64L45 81V49Z" fill="#72785f" stroke="#463728" stroke-width="1.35" />
      <path d="M45 49L72 32V61L45 81Z" fill="#4e594b" stroke="#463728" stroke-width="1.35" />
      <path d="M18 35L45 18L72 32L45 49Z M18 35V64L45 81V49Z M45 49L72 32V61L45 81Z" fill="url(#hazel-planes)" opacity=".72" />
      <!-- middle timber -->
      <path d="M31 43L56 28L82 42L56 57Z" fill="url(#hazel-wood)" stroke="#463728" stroke-width="1.35" />
      <path d="M31 43V69L56 84V57Z" fill="#9b6040" stroke="#463728" stroke-width="1.35" />
      <path d="M56 57L82 42V68L56 84Z" fill="#734434" stroke="#463728" stroke-width="1.35" />
      <path d="M31 43L56 28L82 42L56 57Z M31 43V69L56 84V57Z M56 57L82 42V68L56 84Z" fill="url(#hazel-planes)" opacity=".68" />
      <!-- front brick and tying band -->
      <path d="M15 56L40 42L66 56L40 71Z" fill="url(#hazel-brick)" stroke="#463728" stroke-width="1.45" />
      <path d="M15 56V78L40 93V71Z" fill="#984d3d" stroke="#463728" stroke-width="1.45" />
      <path d="M40 71L66 56V78L40 93Z" fill="#693831" stroke="#463728" stroke-width="1.45" />
      <path d="M15 56L40 42L66 56L40 71Z M15 56V78L40 93V71Z M40 71L66 56V78L40 93Z" fill="url(#hazel-planes)" opacity=".72" />
      <path d="M22 59L40 69L59 58" fill="none" stroke="url(#hazel-gold)" stroke-width="3.8" opacity=".96" />
      <path d="M23 76L40 86L57 76" fill="none" stroke="#e5bd72" stroke-width="2.1" opacity=".84" />
      <path d="M18 35L45 18L72 32" fill="none" stroke="url(#hazel-rim)" stroke-width=".52" opacity=".72" />
    </g>
  </g>
</svg>
